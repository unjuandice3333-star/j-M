# =============================================================================
# E2E de navegador contra Supabase LOCAL (M35) — workflow INDEPENDIENTE y NO exigido por ci-gate.
# Motivo: es una prueba nueva y aún no demostrada en GitHub Actions; hasta que pase de forma estable no debe bloquear
# integraciones. Sin secretos, sin entornos y sin permisos de escritura (regla 6 de migrations_policy.sh): Supabase se
# levanta en contenedores efímeros del runner y se destruye al terminar. Production es inalcanzable desde aquí.
# Acciones fijadas por SHA de commit (las mismas que ci.yml).
# =============================================================================
name: e2e-supabase

on:
  push:
    branches: ['mission/**']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: e2e-supabase-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '22'
  SUPABASE_CLI_VERSION: '3.0.0'
  CI_OUT: ${{ github.workspace }}/ci-artifacts

jobs:
  e2e-supabase:
    name: e2e-supabase   # E2E de navegador con Supabase local (informativo; no es requisito de ci-gate)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0 (node24)
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5.0.0 (node24; versión desde packageManager)
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0 (node24)
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - name: Dependencias (lockfile congelado)
        run: pnpm install --frozen-lockfile
      - name: Chromium de Playwright
        run: bash scripts/ci/install_chromium.sh   # límite por intento y reintentos (D117)
      - name: Cliente psql
        # D149: reintentos de apt ante caídas transitorias del espejo de Ubuntu (CI nº 269: azure.archive inaccesible).
        run: sudo apt-get -o Acquire::Retries=5 -o Acquire::http::Timeout=30 update -q && sudo apt-get -o Acquire::Retries=5 -o Acquire::http::Timeout=30 install -y -q postgresql-client
      - uses: supabase/setup-cli@1dedf2c611547ede7232d26866dd3c56ab903bbb # v1.7.3
        with:
          version: ${{ env.SUPABASE_CLI_VERSION }}
      - name: Aislar Wompi (estos E2E nunca deben contactarlo)
        # Sin esto el runner (con internet) carga el widget real desde checkout.wompi.co y la página no navega a la
        # confirmación. Al bloquear el dominio, el pedido se crea y el pago queda «no disponible», como en local.
        run: echo "0.0.0.0 checkout.wompi.co sandbox.wompi.co production.wompi.co" | sudo tee -a /etc/hosts
      - name: Supabase local + recorridos E2E
        run: bash scripts/ci/e2e_supabase.sh
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0 (node24)
        if: always()
        with:
          name: e2e-supabase-${{ github.sha }}
          path: ci-artifacts/e2e_supabase/
          retention-days: 14
